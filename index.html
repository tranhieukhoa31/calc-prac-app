<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculus Practice</title>

<script>
MathJax = {
  tex: { packages: {'[+]': ['ams']} },
  loader: { load: ['[tex]/ams'] },
  startup: { typeset: false }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" id="MathJax-script"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:wght@600&family=JetBrains+Mono:wght@400&display=swap');

:root {
  --bg:        #f7f6f3;
  --bg2:       #efeee9;
  --border:    #d8d5cc;
  --ink:       #1a1a1a;
  --ink2:      #555550;
  --ink3:      #999990;
  --accent:    #4a6fa5;
  --correct:   #2e7d52;
  --incorrect: #b84040;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  line-height: 1.6;
  min-height: 100vh;
}

.app { display: flex; height: 100vh; overflow: hidden; }

/* ── Mobile top bar (hidden on desktop) ── */
.mobile-topbar {
  display: none;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.mobile-topbar h1 {
  font-family: 'Lora', serif;
  font-size: 15px; font-weight: 600;
}
.menu-btn {
  background: white;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 14px;
  font-size: 13px;
  color: var(--ink2);
  cursor: pointer;
  font-family: 'Inter', sans-serif;
}
.menu-btn:active { background: var(--bg2); }

/* ── Mobile sidebar overlay backdrop ── */
.sidebar-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.3);
  z-index: 199;
}
.sidebar-backdrop.open { display: block; }

.sidebar {
  width: 220px; flex-shrink: 0;
  background: var(--bg);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow-y: auto;
}

.sidebar-header {
  padding: 20px 16px 14px;
  border-bottom: 1px solid var(--border);
}
.sidebar-header h1 {
  font-family: 'Lora', serif;
  font-size: 15px; font-weight: 600;
}
.sidebar-header p { font-size: 11px; color: var(--ink3); margin-top: 2px; }

.student-bar {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}
.student-bar label {
  font-size: 11px; color: var(--ink3);
  display: block; margin-bottom: 4px;
}
.student-bar input {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 4px; padding: 6px 8px;
  font-size: 12px; font-family: 'Inter', sans-serif;
  background: white; color: var(--ink); outline: none;
}
.student-bar input:focus { border-color: var(--accent); }

.sidebar-section {
  padding: 12px 16px 4px;
  font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--ink3);
}

.topic-list { padding: 2px 0 6px; }
.topic-item {
  padding: 6px 16px;
  font-size: 12px; color: var(--ink2);
  cursor: pointer;
  display: flex; align-items: center; justify-content: space-between;
  transition: background 0.1s;
}
.topic-item:hover { background: var(--bg2); }
.topic-item.active {
  background: var(--bg2); color: var(--ink);
  font-weight: 500;
  border-left: 2px solid var(--accent);
  padding-left: 14px;
}
.topic-count { font-size: 10px; color: var(--ink3); }

.diff-filter {
  padding: 4px 16px 12px;
  display: flex; gap: 4px;
}
.diff-btn {
  flex: 1; padding: 4px 2px; text-align: center;
  font-size: 11px; cursor: pointer;
  border: 1px solid var(--border);
  border-radius: 3px; color: var(--ink3);
  background: white; transition: all 0.1s;
}
.diff-btn:hover { border-color: var(--accent); color: var(--accent); }
.diff-btn.active { background: var(--accent); border-color: var(--accent); color: white; }

.stats-box {
  margin: 4px 16px 16px;
  border: 1px solid var(--border);
  border-radius: 4px; padding: 10px 12px;
  background: white;
}
.stats-box h4 {
  font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--ink3); margin-bottom: 8px;
}
.stat-row { display: flex; justify-content: space-between; margin-bottom: 3px; }
.stat-label { font-size: 11px; color: var(--ink2); }
.stat-val   { font-size: 12px; font-weight: 600; color: var(--ink); }

.main {
  flex: 1; overflow-y: auto;
  padding: 40px 32px 80px;
  display: flex; flex-direction: column;
  align-items: center;
}

.card-wrap { width: 100%; max-width: 620px; }

.progress-meta {
  display: flex; justify-content: space-between;
  font-size: 11px; color: var(--ink3); margin-bottom: 16px;
}

.problem-card {
  background: white;
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: 4px;
  padding: 28px 32px;
  min-width: 0;
}

.card-meta {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 16px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--bg2);
}
.topic-label { font-size: 11px; color: var(--accent); font-weight: 500; }
.diff-label  { font-size: 11px; color: var(--ink3); }
.problem-id  {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; color: var(--ink3); margin-left: auto;
}

/* MathJax output sits inside these containers */
.problem-statement {
  font-size: 16px;
  line-height: 1.8;
  color: var(--ink);
  margin-bottom: 24px;
  min-height: 40px;
}
.problem-statement > span {
  white-space: normal;
}
.problem-statement mjx-container {
  display: inline !important;
}

.timer {
  font-size: 11px; color: var(--ink3);
  font-family: 'JetBrains Mono', monospace;
  margin-bottom: 20px;
}

.hints-area { margin-bottom: 18px; }
.hint-item {
  border-left: 2px solid var(--border);
  padding: 8px 12px; margin-bottom: 8px;
  font-size: 13px; color: var(--ink2);
  background: var(--bg); border-radius: 0 3px 3px 0;
}
.hint-item strong {
  font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.07em;
  color: var(--ink3); display: block; margin-bottom: 2px;
}

.action-row {
  display: flex; gap: 8px; flex-wrap: wrap;
  padding-top: 4px;
}

.btn {
  padding: 8px 16px; border-radius: 3px;
  font-size: 13px; font-weight: 500;
  cursor: pointer; font-family: 'Inter', sans-serif;
  transition: all 0.1s;
  border: 1px solid var(--border);
  background: white; color: var(--ink2);
}
.btn:hover:not(:disabled) { border-color: var(--ink3); color: var(--ink); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

.btn-correct  { border-color: var(--correct); color: var(--correct); }
.btn-correct:hover:not(:disabled)  { background: var(--correct); color: white; }

.btn-incorrect { border-color: var(--incorrect); color: var(--incorrect); }
.btn-incorrect:hover:not(:disabled) { background: var(--incorrect); color: white; }

.btn-next {
  margin-left: auto;
  background: var(--accent); border-color: var(--accent); color: white;
}
.btn-next:hover:not(:disabled) { background: #3d5e8e; border-color: #3d5e8e; }

.answer-box {
  margin-top: 20px; padding: 16px 18px;
  border: 1px solid var(--border);
  border-radius: 3px; background: var(--bg);
}
.answer-box h4 {
  font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--ink3); margin-bottom: 10px;
}

.steps-list { margin-top: 14px; }
.step-item {
  display: flex; gap: 10px;
  padding: 8px 0; border-top: 1px solid var(--border);
  align-items: flex-start;
}
.step-num {
  flex-shrink: 0; font-size: 10px; color: var(--ink3);
  font-family: 'JetBrains Mono', monospace;
  margin-top: 3px; min-width: 18px;
}
.step-expl { font-size: 12px; color: var(--ink3); margin-top: 4px; }

.feedback {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  padding: 8px 18px; border-radius: 3px;
  font-size: 13px; font-weight: 500;
  border: 1px solid; background: white;
  pointer-events: none; transition: opacity 0.3s; z-index: 100;
}
.feedback.correct   { color: var(--correct);   border-color: var(--correct); }
.feedback.incorrect { color: var(--incorrect); border-color: var(--incorrect); }
.feedback.hidden    { opacity: 0; }

.save-status {
  font-size: 11px; color: var(--ink3);
  margin-top: 6px; text-align: right; min-height: 16px;
}
.save-status.saved  { color: var(--correct); }
.save-status.failed { color: var(--incorrect); }

.log-wrap { width: 100%; max-width: 620px; margin-top: 32px; }
.log-header {
  font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--ink3); margin-bottom: 8px;
}
.log-table {
  width: 100%; border-collapse: collapse;
  background: white;
  border: 1px solid var(--border); border-radius: 3px; overflow: hidden;
}
.log-table th {
  font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--ink3); text-align: left;
  padding: 7px 10px;
  background: var(--bg2); border-bottom: 1px solid var(--border);
}
.log-table td {
  padding: 6px 10px; font-size: 12px; color: var(--ink2);
  border-bottom: 1px solid var(--bg2);
}
.log-table tr:last-child td { border-bottom: none; }
.r-correct   { color: var(--correct);   font-weight: 600; }
.r-incorrect { color: var(--incorrect); font-weight: 600; }

.export-btn {
  margin-top: 10px;
  border: 1px solid var(--border); background: white; color: var(--ink2);
  font-size: 12px; padding: 6px 12px; border-radius: 3px;
  cursor: pointer; font-family: 'Inter', sans-serif;
}
.export-btn:hover { border-color: var(--ink3); color: var(--ink); }

.empty-state { text-align: center; padding: 60px 20px; color: var(--ink3); }

@media (max-width: 680px) {
  .mobile-topbar { display: flex; }

  .app { flex-direction: column; height: auto; min-height: 100vh; overflow: visible; }

  .sidebar {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    width: 280px;
    max-width: 85vw;
    z-index: 200;
    transform: translateX(-100%);
    transition: transform 0.25s ease;
    box-shadow: 4px 0 24px rgba(0,0,0,0.15);
  }
  .sidebar.open { transform: translateX(0); }

  .main { padding: 16px 12px 60px; width: 100%; overflow-y: visible; }

  .problem-card { padding: 18px 16px; }

  .problem-statement { font-size: 16px; line-height: 1.7; }

  /* Larger touch targets for buttons */
  .btn {
    padding: 12px 16px;
    font-size: 14px;
    min-height: 44px;
  }
  .action-row { gap: 10px; }
  .action-row .btn { flex: 1 1 auto; min-width: 42%; }
  .btn-next { flex: 1 1 100%; }

  .diff-btn { padding: 10px 4px; font-size: 12px; }

  .student-bar input { padding: 10px 10px; font-size: 14px; }

  .log-table { font-size: 11px; }
  .log-table th, .log-table td { padding: 6px 6px; }

  /* Hide less critical columns on very small screens to avoid horizontal scroll */
  .log-table th:nth-child(7), .log-table td:nth-child(7) { display: none; }
}

@media (max-width: 400px) {
  .action-row .btn { min-width: 100%; }
  .topic-label, .diff-label { font-size: 10px; }
}
</style>
</head>
<body>

<div class="app">
  <div class="mobile-topbar">
    <h1>Calculus Practice</h1>
    <button class="menu-btn" id="menuBtn">Menu</button>
  </div>

  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1>Calculus Practice</h1>
      <p>Secondary 4 &middot; 62 problems</p>
    </div>

    <div class="student-bar">
      <label for="studentId">Name or ID</label>
      <input type="text" id="studentId" placeholder="e.g. Alice">
      <div id="switchIdentityRow" style="margin-top:4px;font-size:10px;color:var(--ink3);display:none;">
        Not you? <a href="#" id="switchIdentityLink" style="color:var(--accent);text-decoration:none;">Switch</a>
      </div>
    </div>

    <div class="sidebar-section">Topic</div>
    <div class="topic-list" id="topicList"></div>

    <div class="sidebar-section">Difficulty</div>
    <div class="diff-filter" id="diffFilter">
      <div class="diff-btn active" data-diff="0">Any</div>
      <div class="diff-btn" data-diff="1">1</div>
      <div class="diff-btn" data-diff="2">2</div>
      <div class="diff-btn" data-diff="3">3</div>
      <div class="diff-btn" data-diff="4">4</div>
    </div>

    <div class="stats-box">
      <h4>Session</h4>
      <div class="stat-row"><span class="stat-label">Attempted</span><span class="stat-val" id="statAttempted">0</span></div>
      <div class="stat-row"><span class="stat-label">Correct</span><span class="stat-val" id="statCorrect">0</span></div>
      <div class="stat-row"><span class="stat-label">Accuracy</span><span class="stat-val" id="statAccuracy">—</span></div>
      <div class="stat-row"><span class="stat-label">Hints used</span><span class="stat-val" id="statHints">0</span></div>
    </div>
  </aside>

  <main class="main" id="mainArea"></main>
</div>

<div class="feedback hidden" id="feedback"></div>

<script>
// Problems and topics are now fetched from the server instead of
// being embedded directly in this file. This keeps the file small
// and means new problems can be added without editing this HTML.
let PROBLEMS = [];
let TOPIC_GRAPH = {};


const SERVER_URL = 'https://tranhieukhoa.pythonanywhere.com';

const TOPIC_LABELS = {};
function refreshTopicLabels() {
  Object.entries(TOPIC_GRAPH).forEach(([k, v]) => TOPIC_LABELS[k] = v.label);
}

// ── State ─────────────────────────────────────────────────────────────────
let selectedTopic  = 'all';
let selectedDiff   = 0;
let currentProblem = null;
let hintsShown     = 0;
let answered       = false;
let showingAnswer  = false;
let timerInterval  = null;
let timerSeconds   = 0;
const attempts     = [];
let sessionCorrect = 0;
let sessionHints   = 0;

// ── MathJax: convert a LaTeX string directly to a DOM node ────────────────
// This avoids all delimiter scanning issues entirely.
// We wait for MathJax to be ready before calling tex2chtml.
function latexToNode(tex, display) {
  if (!window.MathJax || !MathJax.tex2chtml) {
    // MathJax not ready yet — return plain text as fallback
    const span = document.createElement('span');
    span.textContent = tex;
    return span;
  }
  try {
    const node = MathJax.tex2chtml(tex, { display: display || false });
    // tex2chtml updates internal styles; apply them to document
    MathJax.startup.document.clear();
    MathJax.startup.document.updateDocument();
    return node;
  } catch (e) {
    const span = document.createElement('span');
    span.textContent = tex;
    return span;
  }
}

// Inject LaTeX into a container element by id
function renderLatex(containerId, tex, display) {
  const el = document.getElementById(containerId);
  if (!el) return;
  el.innerHTML = '';
  el.appendChild(latexToNode(tex, display));
}

// ── Wrappable renderer: splits \text{...} into plain HTML text so it can
// line-wrap normally, and renders surrounding math symbols as small inline
// MathJax nodes. This fixes long sentences getting clipped on narrow screens,
// since a single MathJax SVG block cannot wrap internally.
function renderMixedContent(container, tex) {
  container.innerHTML = '';
  container.style.display = 'block';

  // Split on \text{...} blocks, capturing the text inside
  const regex = /\\text\{([^}]*)\}/g;
  let lastIndex = 0;
  let match;
  const wrapper = document.createElement('span');
  wrapper.style.display = 'inline';

  function appendMathSegment(segment) {
    const trimmed = segment.trim();
    if (!trimmed) return;
    wrapper.appendChild(document.createTextNode(' '));
    const node = latexToNode(trimmed, false);
    node.style.display = 'inline';
    wrapper.appendChild(node);
    wrapper.appendChild(document.createTextNode(' '));
  }

  while ((match = regex.exec(tex)) !== null) {
    // Math segment before this \text{...} block
    const before = tex.slice(lastIndex, match.index);
    if (before.trim()) appendMathSegment(before);

    // The text itself — plain wrappable HTML, split into words so the
    // browser can break anywhere a normal space exists
    const words = match[1].split(/(\s+)/);
    words.forEach(w => {
      if (w === '') return;
      wrapper.appendChild(document.createTextNode(w));
    });

    lastIndex = regex.lastIndex;
  }

  // Trailing math segment after the last \text{...}
  const tail = tex.slice(lastIndex);
  if (tail.trim()) appendMathSegment(tail);

  container.appendChild(wrapper);
}

// ── Mobile sidebar toggle ─────────────────────────────────────────────────
function openSidebar() {
  document.getElementById('sidebar')?.classList.add('open');
  document.getElementById('sidebarBackdrop')?.classList.add('open');
}
function closeSidebar() {
  document.getElementById('sidebar')?.classList.remove('open');
  document.getElementById('sidebarBackdrop')?.classList.remove('open');
}
document.getElementById('menuBtn')?.addEventListener('click', openSidebar);
document.getElementById('sidebarBackdrop')?.addEventListener('click', closeSidebar);

// ── Sidebar: topics ───────────────────────────────────────────────────────
function buildTopics() {
  const list   = document.getElementById('topicList');
  const counts = {};
  PROBLEMS.forEach(p => { counts[p.topic] = (counts[p.topic] || 0) + 1; });

  const allEl = document.createElement('div');
  allEl.className     = 'topic-item active';
  allEl.dataset.topic = 'all';
  allEl.innerHTML     = `<span>All topics</span><span class="topic-count">${PROBLEMS.length}</span>`;
  allEl.addEventListener('click', () => selectTopic('all'));
  list.appendChild(allEl);

  [...new Set(PROBLEMS.map(p => p.topic))].forEach(key => {
    const el = document.createElement('div');
    el.className     = 'topic-item';
    el.dataset.topic = key;
    el.innerHTML     = `<span>${TOPIC_LABELS[key] || key}</span><span class="topic-count">${counts[key] || 0}</span>`;
    el.addEventListener('click', () => selectTopic(key));
    list.appendChild(el);
  });
}

function selectTopic(topic) {
  selectedTopic = topic;
  document.querySelectorAll('.topic-item').forEach(el =>
    el.classList.toggle('active', el.dataset.topic === topic));
  loadNextProblem();
  closeSidebar();
}

// ── Difficulty filter ─────────────────────────────────────────────────────
document.getElementById('diffFilter').addEventListener('click', e => {
  const btn = e.target.closest('.diff-btn');
  if (!btn) return;
  selectedDiff = +btn.dataset.diff;
  document.querySelectorAll('.diff-btn').forEach(b =>
    b.classList.toggle('active', b === btn));
  loadNextProblem();
  closeSidebar();
});

// ── Problem pool ──────────────────────────────────────────────────────────
function getPool() {
  let pool = PROBLEMS;
  if (selectedTopic !== 'all') pool = pool.filter(p => p.topic === selectedTopic);
  if (selectedDiff > 0)        pool = pool.filter(p => p.difficulty === selectedDiff);
  return pool;
}

function pickProblem() {
  const pool = getPool();
  if (!pool.length) return null;
  const attCounts = {};
  attempts.forEach(a => { attCounts[a.problem_id] = (attCounts[a.problem_id] || 0) + 1; });
  const weights = pool.map(p => 1 / (1 + (attCounts[p.problem_id] || 0)));
  const total   = weights.reduce((s, w) => s + w, 0);
  let r = Math.random() * total;
  for (let i = 0; i < pool.length; i++) {
    r -= weights[i];
    if (r <= 0) return pool[i];
  }
  return pool[pool.length - 1];
}

// ── Timer ─────────────────────────────────────────────────────────────────
function startTimer() {
  clearInterval(timerInterval);
  timerSeconds = 0;
  updateTimer();
  timerInterval = setInterval(() => { timerSeconds++; updateTimer(); }, 1000);
}
function stopTimer() { clearInterval(timerInterval); }
function updateTimer() {
  const el = document.getElementById('timerDisplay');
  if (!el) return;
  const m = Math.floor(timerSeconds / 60);
  const s = timerSeconds % 60;
  el.textContent = `${m}:${s.toString().padStart(2, '0')}`;
}

// ── Load next problem ─────────────────────────────────────────────────────
// If the student hasn't manually narrowed to a specific topic/difficulty,
// ask the server for a BKT-driven recommendation. If they HAVE picked a
// specific topic or difficulty, respect that choice and pick locally from
// the filtered pool instead — manual browsing always overrides the
// recommender.
let lastRecommendation = null;  // stores target_topic/difficulty for display, if used

async function loadNextProblem() {
  hintsShown    = 0;
  answered      = false;
  showingAnswer = false;
  stopTimer();
  lastRecommendation = null;

  const usingManualFilter = (selectedTopic !== 'all' || selectedDiff > 0);

  if (!usingManualFilter) {
    currentProblem = await fetchRecommendedProblem();
  }

  // Fall back to local random pick if: manual filter is active, OR the
  // recommendation call failed/returned nothing (e.g. server offline).
  if (!currentProblem) {
    currentProblem = pickProblem();
  }

  render();
  if (currentProblem) startTimer();
}

// Ask the server for a BKT-recommended problem for the current student.
// Returns null on any failure so the caller can fall back gracefully.
async function fetchRecommendedProblem() {
  try {
    const studentId = await resolveStudentId();
    const res = await fetch(`${SERVER_URL}/recommend/${encodeURIComponent(studentId)}`);
    if (!res.ok) return null;

    const data = await res.json();
    if (!data.problem) return null;

    lastRecommendation = {
      target_topic:      data.target_topic,
      target_difficulty: data.target_difficulty
    };
    return data.problem;
  } catch (err) {
    return null;  // server offline or network issue — caller falls back
  }
}

// ── Render ────────────────────────────────────────────────────────────────
function render() {
  const main = document.getElementById('mainArea');
  const pool = getPool();

  if (!currentProblem) {
    main.innerHTML = `<div class="empty-state"><p>No problems match these filters.</p></div>`;
    return;
  }

  const p          = currentProblem;
  const topicLabel = TOPIC_LABELS[p.topic] || p.topic;
  const hintTexts  = [p.hint_level_1, p.hint_level_2, p.hint_level_3].filter(Boolean);

  // Build action buttons HTML
  let actionsHtml = '';
  if (!answered) {
    const canHint = hintsShown < hintTexts.length;
    const remaining = hintTexts.length - hintsShown;
    const hintLabel = canHint ? `Hint ${remaining}/${hintTexts.length}` : `0/${hintTexts.length} hints left`;
    actionsHtml = `
      <button class="btn" id="hintBtn" ${!canHint ? 'disabled' : ''}>
        ${hintLabel}
      </button>
      <button class="btn" id="showAnswerBtn">Show answer</button>
      <button class="btn btn-incorrect" id="incorrectBtn">Incorrect</button>
      <button class="btn btn-correct"   id="correctBtn">Correct</button>`;
  } else {
    actionsHtml = `
      <button class="btn" id="showAnswerBtn">${showingAnswer ? 'Hide answer' : 'Show answer'}</button>
      <button class="btn btn-next" id="nextBtn">Next problem</button>`;
  }

  // Scaffold the card — LaTeX containers are empty divs, filled after injection
  main.innerHTML = `
    <div class="card-wrap">
      <div class="progress-meta">
        <span>${attempts.length} attempt${attempts.length !== 1 ? 's' : ''} this session</span>
        <span>${pool.length} problems in pool</span>
      </div>

      <div class="problem-card">
        <div class="card-meta">
          <span class="topic-label">${topicLabel}</span>
          <span class="diff-label">Difficulty ${p.difficulty}/4</span>
          ${lastRecommendation ? '<span class="diff-label" style="color:var(--accent)">· Recommended for you</span>' : ''}
          <span class="problem-id">${p.problem_id}</span>
        </div>

        <div class="problem-statement" id="mathStatement"></div>

        <div class="timer">
          <span id="timerDisplay">0:00</span>
        </div>

        <div class="hints-area" id="hintsArea"></div>
        <div class="action-row">${actionsHtml}</div>
        <div id="answerArea"></div>
      </div>

      <div class="save-status" id="saveStatus"></div>
    </div>
    <div class="log-wrap" id="logWrap"></div>
  `;

  // Attach button events
  document.getElementById('hintBtn')?.addEventListener('click', showHint);
  document.getElementById('correctBtn')?.addEventListener('click',   () => recordAttempt(true));
  document.getElementById('incorrectBtn')?.addEventListener('click', () => recordAttempt(false));
  document.getElementById('nextBtn')?.addEventListener('click', loadNextProblem);
  document.getElementById('showAnswerBtn')?.addEventListener('click', toggleAnswer);

  renderLog();

  // Now render all LaTeX — MathJax is ready by the time the user sees a problem
  renderAllMath();
}

// ── Render all math in the current card ───────────────────────────────────
function renderAllMath() {
  const p = currentProblem;
  if (!p) return;

  // Problem statement — split on ||| (safe delimiter replacing LaTeX \\ line breaks)
  const stmtEl = document.getElementById('mathStatement');
  if (stmtEl) {
    stmtEl.innerHTML = '';
    const lines = p.statement_latex.split('|||');
    lines.forEach((line, i) => {
      const lineDiv = document.createElement('div');
      lineDiv.style.marginBottom = lines.length > 1 && i < lines.length - 1 ? '6px' : '0';
      if (line.trim()) {
        renderMixedContent(lineDiv, line.trim());
      }
      stmtEl.appendChild(lineDiv);
    });
  }

  // Hints
  const hintTexts = [p.hint_level_1, p.hint_level_2, p.hint_level_3].filter(Boolean);
  const hintsArea = document.getElementById('hintsArea');
  if (hintsArea) {
    hintsArea.innerHTML = '';
    for (let i = 0; i < hintsShown; i++) {
      const div = document.createElement('div');
      div.className = 'hint-item';
      const label = document.createElement('strong');
      label.textContent = `Hint ${i + 1}`;
      div.appendChild(label);
      div.appendChild(document.createTextNode(hintTexts[i]));
      hintsArea.appendChild(div);
    }
  }

  // Answer + steps
  if (showingAnswer) {
    const answerArea = document.getElementById('answerArea');
    if (!answerArea) return;

    const steps = Array.isArray(p.solution_steps)
      ? p.solution_steps
      : JSON.parse(p.solution_steps || '[]');

    const box = document.createElement('div');
    box.className = 'answer-box';

    const h4 = document.createElement('h4');
    h4.textContent = 'Answer';
    box.appendChild(h4);

    // Answer latex
    box.appendChild(latexToNode(p.answer_latex, true));

    // Steps
    if (steps.length) {
      const stepsList = document.createElement('div');
      stepsList.className = 'steps-list';

      steps.forEach((s, i) => {
        const item = document.createElement('div');
        item.className = 'step-item';

        const num = document.createElement('div');
        num.className = 'step-num';
        num.textContent = `${i + 1}.`;

        const content = document.createElement('div');
        content.style.flex = '1';

        const mathDiv = document.createElement('div');
        mathDiv.appendChild(latexToNode(s.step_latex, false));

        const explDiv = document.createElement('div');
        explDiv.className = 'step-expl';
        explDiv.textContent = s.explanation;

        content.appendChild(mathDiv);
        content.appendChild(explDiv);
        item.appendChild(num);
        item.appendChild(content);
        stepsList.appendChild(item);
      });

      box.appendChild(stepsList);
    }

    answerArea.innerHTML = '';
    answerArea.appendChild(box);
  }
}

// ── Hint ──────────────────────────────────────────────────────────────────
function showHint() {
  const hintTexts = [currentProblem.hint_level_1, currentProblem.hint_level_2, currentProblem.hint_level_3].filter(Boolean);
  if (hintsShown < hintTexts.length) {
    hintsShown++;
    sessionHints++;
    updateStats();
    // Re-render hints without rebuilding the whole card
    const hintsArea = document.getElementById('hintsArea');
    if (hintsArea) {
      const div = document.createElement('div');
      div.className = 'hint-item';
      const label = document.createElement('strong');
      label.textContent = `Hint ${hintsShown}`;
      div.appendChild(label);
      div.appendChild(document.createTextNode(hintTexts[hintsShown - 1]));
      hintsArea.appendChild(div);
    }
    // Update hint button
    const hintBtn = document.getElementById('hintBtn');
    if (hintBtn) {
      const canMore = hintsShown < hintTexts.length;
      const remaining = hintTexts.length - hintsShown;
      hintBtn.textContent = canMore
        ? `Hint ${remaining}/${hintTexts.length}`
        : `0/${hintTexts.length} hints left`;
      hintBtn.disabled = !canMore;
    }
  }
}

function toggleAnswer() {
  showingAnswer = !showingAnswer;
  const btn = document.getElementById('showAnswerBtn');
  if (btn) btn.textContent = showingAnswer ? 'Hide answer' : 'Show answer';
  renderAllMath();
}

// ── Persistent student identity ─────────────────────────────────────────────
// Saved to localStorage so the same student is recognised across sessions —
// closing the tab and coming back later, or practicing over several days,
// still counts as one person rather than a fresh guest each time.
const STORAGE_KEY = 'calc_practice_student_id';

// Normalise a typed name: trim, collapse extra spaces, consistent capitalisation.
// This prevents "Ha Phan", "ha phan", and "Ha  Phan" from being treated as
// three different students.
function normalizeName(raw) {
  const trimmed = raw.trim().replace(/\s+/g, ' ');
  if (!trimmed) return '';
  return trimmed.toLowerCase();
}

async function resolveStudentId() {
  const typedRaw = document.getElementById('studentId').value;
  const typed = normalizeName(typedRaw);

  if (typed) {
    localStorage.setItem(STORAGE_KEY, typed);
    return typed;
  }

  // Nothing typed — reuse a previously saved identity for this browser, if any
  const stored = localStorage.getItem(STORAGE_KEY);
  if (stored) return stored;

  // First-ever visit with no typed name — get a fresh sequential guest ID
  try {
    const res = await fetch(`${SERVER_URL}/next-guest-id`);
    if (res.ok) {
      const data = await res.json();
      localStorage.setItem(STORAGE_KEY, data.guest_id);
      const input = document.getElementById('studentId');
      if (input) input.placeholder = `e.g. Alice (you are ${data.guest_id})`;
      return data.guest_id;
    }
  } catch (err) {
    // Server offline — fall back to an unsaved local label
  }

  return 'guest_offline';
}

// Pre-fill the name field on page load if this browser already has a saved identity.
function restoreSavedIdentity() {
  const stored = localStorage.getItem(STORAGE_KEY);
  const input = document.getElementById('studentId');
  if (stored && input && !input.value) {
    input.value = stored;
  }
}

// Let a student on a shared device switch to a different identity.
function clearSavedIdentity() {
  localStorage.removeItem(STORAGE_KEY);
  const input = document.getElementById('studentId');
  if (input) {
    input.value = '';
    input.placeholder = 'e.g. Alice';
  }
}

// ── Record attempt & POST ─────────────────────────────────────────────────
async function recordAttempt(correct) {
  if (!currentProblem || answered) return;
  stopTimer();
  answered = true;

  const studentId = await resolveStudentId();
  const record = {
    student_id:   studentId,
    problem_id:   currentProblem.problem_id,
    topic:        currentProblem.topic,
    difficulty:   currentProblem.difficulty,
    correct:      correct ? 1 : 0,
    hints_used:   hintsShown,
    time_seconds: timerSeconds,
    timestamp:    new Date().toISOString()
  };
  attempts.push(record);
  if (correct) sessionCorrect++;
  updateStats();
  showFeedback(correct);

  // Swap action buttons to show answer / next
  const actionRow = document.querySelector('.action-row');
  if (actionRow) {
    actionRow.innerHTML = `
      <button class="btn" id="showAnswerBtn">Show answer</button>
      <button class="btn btn-next" id="nextBtn">Next problem</button>`;
    document.getElementById('nextBtn').addEventListener('click', loadNextProblem);
    document.getElementById('showAnswerBtn').addEventListener('click', toggleAnswer);
  }

  renderLog();

  // POST to Flask server
  const statusEl = document.getElementById('saveStatus');
  try {
    const res = await fetch(`${SERVER_URL}/attempt`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify(record)
    });
    if (res.ok) {
      const data = await res.json();
      if (statusEl) {
        statusEl.textContent = `Saved (attempt #${data.attempt_id})`;
        statusEl.className   = 'save-status saved';
      }
    } else {
      throw new Error('HTTP ' + res.status);
    }
  } catch (err) {
    if (statusEl) {
      statusEl.textContent = 'Not saved — server offline. Use Export CSV.';
      statusEl.className   = 'save-status failed';
    }
  }
}

function showFeedback(correct) {
  const el = document.getElementById('feedback');
  el.textContent = correct ? 'Correct' : 'Incorrect';
  el.className   = `feedback ${correct ? 'correct' : 'incorrect'}`;
  setTimeout(() => { el.className = 'feedback hidden'; }, 1600);
}

function updateStats() {
  document.getElementById('statAttempted').textContent = attempts.length;
  document.getElementById('statCorrect').textContent   = sessionCorrect;
  document.getElementById('statAccuracy').textContent  =
    attempts.length ? Math.round((sessionCorrect / attempts.length) * 100) + '%' : '—';
  document.getElementById('statHints').textContent     = sessionHints;
}

function renderLog() {
  const wrap = document.getElementById('logWrap');
  if (!wrap || attempts.length === 0) return;
  const recent = [...attempts].reverse().slice(0, 15);
  const rows   = recent.map(a => `
    <tr>
      <td>${a.student_id}</td>
      <td style="font-family:'JetBrains Mono',monospace;font-size:11px">${a.problem_id}</td>
      <td>${TOPIC_LABELS[a.topic] || a.topic}</td>
      <td>${a.difficulty}</td>
      <td class="${a.correct ? 'r-correct' : 'r-incorrect'}">${a.correct ? '✓' : '✗'}</td>
      <td>${a.hints_used}</td>
      <td>${a.time_seconds}s</td>
    </tr>`).join('');
  wrap.innerHTML = `
    <div class="log-header">Attempts this session (${attempts.length})</div>
    <table class="log-table">
      <thead><tr>
        <th>Student</th><th>Problem</th><th>Topic</th>
        <th>Diff</th><th>Result</th><th>Hints</th><th>Time</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <button class="export-btn" id="exportBtn">Export CSV</button>
  `;
  document.getElementById('exportBtn')?.addEventListener('click', exportCSV);
}

function exportCSV() {
  const headers = ['student_id','problem_id','topic','difficulty','correct','hints_used','time_seconds','timestamp'];
  const rows    = attempts.map(a => headers.map(h => JSON.stringify(a[h] ?? '')).join(','));
  const csv     = [headers.join(','), ...rows].join('\n');
  const blob    = new Blob([csv], { type: 'text/csv' });
  const a       = document.createElement('a');
  a.href        = URL.createObjectURL(blob);
  a.download    = 'calculus_attempts.csv';
  a.click();
}

// ── Fetch problems and topics from the server ─────────────────────────────
async function loadData() {
  const main = document.getElementById('mainArea');
  main.innerHTML = `<div class="empty-state"><p>Loading problems…</p></div>`;

  try {
    const [problemsRes, topicsRes] = await Promise.all([
      fetch(`${SERVER_URL}/problems`),
      fetch(`${SERVER_URL}/topics`)
    ]);

    if (!problemsRes.ok || !topicsRes.ok) {
      throw new Error('Server returned an error');
    }

    PROBLEMS    = await problemsRes.json();
    TOPIC_GRAPH = await topicsRes.json();
    refreshTopicLabels();

    if (!PROBLEMS.length) {
      main.innerHTML = `<div class="empty-state"><p>No problems found. Check back later.</p></div>`;
      return;
    }

    return true;
  } catch (err) {
    main.innerHTML = `
      <div class="empty-state">
        <p>Could not load problems from the server.</p>
        <p style="font-size:12px;margin-top:8px;color:var(--ink3)">${err.message}</p>
      </div>`;
    return false;
  }
}

// ── Init: fetch data, wait for MathJax, then start ────────────────────────
async function init() {
  restoreSavedIdentity();
  updateSwitchIdentityVisibility();

  document.getElementById('switchIdentityLink')?.addEventListener('click', (e) => {
    e.preventDefault();
    clearSavedIdentity();
    updateSwitchIdentityVisibility();
  });
  document.getElementById('studentId')?.addEventListener('input', updateSwitchIdentityVisibility);

  const loaded = await loadData();
  if (!loaded) return;

  buildTopics();

  if (window.MathJax && MathJax.startup) {
    MathJax.startup.promise.then(() => loadNextProblem());
  } else {
    document.getElementById('MathJax-script').addEventListener('load', () => {
      MathJax.startup.promise.then(() => loadNextProblem());
    });
  }
}

function updateSwitchIdentityVisibility() {
  const row = document.getElementById('switchIdentityRow');
  const input = document.getElementById('studentId');
  if (row && input) {
    row.style.display = input.value.trim() ? 'block' : 'none';
  }
}

init();
</script>
